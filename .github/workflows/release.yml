name: release-apk

# Push a tag like v0.1.0 to get an unsigned-with-debug-key release APK as a
# downloadable artifact. Store signing stays on the owner's machine.
on:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: ls -la build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: meishi_ocr-${{ github.ref_name }}-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
