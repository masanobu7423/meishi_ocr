name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: flutter test (golden accuracy table goes to the job summary)
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
          {
            echo '## Golden accuracy'
            echo '```'
            sed -n '/=== golden accuracy/,/^$/p' test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
